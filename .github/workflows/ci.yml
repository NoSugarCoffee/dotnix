name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Catches nixpkgs channel drift (e.g. an unfree fetch like google-chrome
    # breaking) even on weeks with no commits to this repo.
    - cron: "17 4 * * 1"
  workflow_dispatch: {}

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix flake check
      - run: nix build .#homeConfigurations.liangliangdai.activationPackage

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix build .#homeConfigurations.liangliangdai-aarch64-darwin.activationPackage

      # Building the derivation only proves it evaluates and fetches/compiles.
      # A new Mac needs the activation *scripts* to also run cleanly, so
      # actually run them here against a throwaway home directory that
      # matches home.nix's hardcoded username/homeDirectory for Darwin.
      - name: Activate the configuration end-to-end
        run: |
          set -euo pipefail
          sudo mkdir -p /Users/liangliangdai
          sudo chown "$(id -u):$(id -g)" /Users/liangliangdai
          HOME=/Users/liangliangdai USER=liangliangdai LOGNAME=liangliangdai "$(readlink -f result)/activate"

      # Standalone Home Manager (no nix-darwin) keeps its profile at
      # ~/.local/state/nix/profiles/home-manager, not ~/.nix-profile -- so
      # search rather than assume an exact nesting under it.
      - name: Smoke-test the activated profile
        run: |
          set -euo pipefail
          export HOME=/Users/liangliangdai
          echo "== $HOME layout (depth 4) =="
          find -L "$HOME" -maxdepth 4 | sort

          codex_bin=$(find -L "$HOME/.local/state/nix/profiles" -maxdepth 4 -type f -name codex -perm -111 -print -quit)
          chrome_app=$(find -L "$HOME/Applications" -maxdepth 4 -iname "Google Chrome.app" -print -quit)

          echo "codex:       ${codex_bin:-NOT FOUND}"
          echo "chrome:      ${chrome_app:-NOT FOUND}"

          test -n "$codex_bin"
          test -n "$chrome_app"

      # The activation log proving a tool installed says nothing about a real
      # terminal finding it: sessionPath only reaches PATH if the managed
      # ~/.zshrc sources home-manager's session vars. Simulate what a user
      # actually gets -- an interactive zsh -- and require the asdf shims to
      # resolve there (this caught "command not found: npm" on a real Mac).
      - name: Smoke-test PATH in an interactive zsh
        run: |
          set -euo pipefail
          export HOME=/Users/liangliangdai
          npm_path=$(/bin/zsh -i -c 'command -v npm' 2>/dev/null | tail -1 || true)
          lark_path=$(/bin/zsh -i -c 'command -v lark-cli' 2>/dev/null | tail -1 || true)
          echo "npm:      ${npm_path:-NOT FOUND}"
          echo "lark-cli: ${lark_path:-NOT FOUND}"
          [ "$npm_path" = "$HOME/.asdf/shims/npm" ]
          [ "$lark_path" = "$HOME/.asdf/shims/lark-cli" ]
