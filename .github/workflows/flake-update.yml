name: Update flake inputs

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: flake-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Warn if UPDATE_PAT is unset
        env:
          UPDATE_PAT: ${{ secrets.UPDATE_PAT }}
        run: |
          if [ -z "$UPDATE_PAT" ]; then
            echo "::warning::UPDATE_PAT secret is not set; falling back to GITHUB_TOKEN, so the flake-lock update PR won't trigger CI and auto-merge won't complete."
          fi
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - id: update
        uses: DeterminateSystems/update-flake-lock@v29
        with:
          # A PAT/App token is required for the PR to trigger CI (the default
          # GITHUB_TOKEN can't fire other workflows); falls back to
          # GITHUB_TOKEN if the secret isn't set, though CI then won't run.
          token: ${{ secrets.UPDATE_PAT || secrets.GITHUB_TOKEN }}
          branch: chore/flake-update
          pr-title: "chore(flake): update inputs"
          pr-labels: automation
      - if: steps.update.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.UPDATE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          # Enables auto-merge rather than merging directly, so the merge
          # waits for main's required status checks (lint, build-linux,
          # build-macos) to pass first.
          gh pr merge ${{ steps.update.outputs.pull-request-number }} \
            --auto --squash --delete-branch
