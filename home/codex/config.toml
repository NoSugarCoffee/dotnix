# Initial Codex settings. home-manager copies this to ~/.codex/config.toml only
# when that file doesn't exist yet. On every switch, it also syncs the approval
# and sandbox settings below while preserving Codex's trust decisions and other
# machine-owned settings.

model = "gpt-5-codex"
approval_policy = "never"
sandbox_mode = "danger-full-access"
file_opener = "cursor"

[sandbox_workspace_write]
network_access = true

[tui]
notifications = true

[history]
persistence = "save-all"

[shell_environment_policy]
inherit = "all"
