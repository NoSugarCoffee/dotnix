# Initial Codex settings. home-manager copies this to ~/.codex/config.toml only
# when that file doesn't exist yet; after that Codex owns the file (it persists
# per-folder trust decisions there) and later switches leave it alone. Edits
# here therefore only reach machines that don't have the file yet.

model = "gpt-5-codex"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
file_opener = "cursor"

[sandbox_workspace_write]
network_access = true

[tui]
notifications = true

[history]
persistence = "save-all"

[shell_environment_policy]
inherit = "all"
