# Reference settings for Codex, kept here so a fresh machine can restore them.
#
# This is NOT installed by home-manager: Codex rewrites ~/.codex/config.toml
# itself (answering the TUI's "Trust this folder" prompt persists per-folder
# trust there), and a read-only store symlink makes that write fail with EACCES.
# After `codex login` on a new machine, copy this file to ~/.codex/config.toml.

model = "gpt-5-codex"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
file_opener = "cursor"

[sandbox_workspace_write]
network_access = true

[tui]
notifications = true

[history]
persistence = "save-all"

[shell_environment_policy]
inherit = "all"
