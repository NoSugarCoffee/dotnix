# Initial Codex settings, seeded into ~/.codex/config.toml only when that file
# doesn't exist yet. The keys in managed.toml are synced on every switch.

file_opener = "cursor"

[sandbox_workspace_write]
network_access = true

[tui]
notifications = true

[history]
persistence = "save-all"

[shell_environment_policy]
inherit = "all"
